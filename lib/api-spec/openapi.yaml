        startDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        endDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      required: [id, name, format, description, startDate, endDate]
    ParticipantSession:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/SessionType" }
        scheduledDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        startTime: { type: ["string", "null"] }
        durationMinutes: { type: integer, minimum: 15, maximum: 480 }
        facilitator: { type: ["string", "null"] }
