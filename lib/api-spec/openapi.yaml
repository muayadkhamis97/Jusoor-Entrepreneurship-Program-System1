        assignmentTitle: { type: ["string", "null"] }
        question: { type: string }
        reply: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        repliedAt: { type: ["string", "null"], format: date-time }
      required: [id, programId, sessionTitle, assignmentTitle, question, reply, createdAt, repliedAt]
    AnnouncementKind:
      type: string
