components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApplicationStatus:
      type: string
      enum: [submitted, under_review, accepted, declined]
    ApplicationReviewStatus:
      type: string
      enum: [under_review, accepted, declined]
    ApplicationProgram:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        format: { type: string, enum: [bootcamp, hackathon] }
        description: { type: ["string", "null"] }
        applicationDeadline: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      required: [id, name, format]
    EntrepreneurApplication:
      type: object
      properties:
        id: { type: integer }
        programId: { type: integer }
        programName: { type: string }
        founderName: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        businessName: { type: string }
        industry: { type: ["string", "null"] }
        website: { type: ["string", "null"], format: uri }
        summary: { type: string }
        supportNeeds: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        reviewNotes: { type: ["string", "null"] }
        businessId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, programId, programName, founderName, email, phone, businessName, industry, website, summary, supportNeeds, status, reviewNotes, businessId, createdAt]
    EntrepreneurApplicationInput:
      type: object
      properties:
        programId: { type: integer }
        founderName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 50 }
        businessName: { type: string, minLength: 2, maxLength: 180 }
        industry: { type: ["string", "null"], maxLength: 120 }
        website: { type: ["string", "null"], format: uri, maxLength: 500 }
        summary: { type: string, minLength: 30, maxLength: 3000 }
        supportNeeds: { type: string, minLength: 10, maxLength: 1500 }
      required: [programId, founderName, email, businessName, summary, supportNeeds]
    ApplicationReceipt:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, status, createdAt]
    ApplicationReviewUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ApplicationReviewStatus" }
        reviewNotes: { type: ["string", "null"], maxLength: 3000 }
      required: [status]
    CourseMaterialRole:
      type: string
      enum: [participant, trainer, coordinator]
    CourseMaterialKind:
      type: string
      enum: [video, document, slides, audio, link]
    CourseModuleInput:
      type: object
      properties:
        programId: { type: integer }
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: ["string", "null"], maxLength: 3000 }
        position: { type: integer, minimum: 0, default: 0 }
        releaseAt: { type: ["string", "null"], format: date-time }
        isPublished: { type: boolean, default: false }
      required: [programId, title]
    CourseModuleUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: ["string", "null"], maxLength: 3000 }
        position: { type: integer, minimum: 0 }
        releaseAt: { type: ["string", "null"], format: date-time }
        isPublished: { type: boolean }
    CourseMaterialInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: ["string", "null"], maxLength: 3000 }
        kind: { $ref: "#/components/schemas/CourseMaterialKind" }
        externalUrl: { type: ["string", "null"], format: uri, maxLength: 2000 }
        objectPath: { type: ["string", "null"], maxLength: 500 }
        fileName: { type: ["string", "null"], maxLength: 500 }
        contentType: { type: ["string", "null"], maxLength: 200 }
        fileSize: { type: ["integer", "null"], minimum: 1, maximum: 262144000 }
        allowedRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/CourseMaterialRole" }
        position: { type: integer, minimum: 0, default: 0 }
      required: [title, kind, allowedRoles]
    CourseMaterialUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: ["string", "null"], maxLength: 3000 }
        kind: { $ref: "#/components/schemas/CourseMaterialKind" }
        externalUrl: { type: ["string", "null"], format: uri, maxLength: 2000 }
        objectPath: { type: ["string", "null"], maxLength: 500 }
        fileName: { type: ["string", "null"], maxLength: 500 }
        contentType: { type: ["string", "null"], maxLength: 200 }
        fileSize: { type: ["integer", "null"], minimum: 1, maximum: 262144000 }
        allowedRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/CourseMaterialRole" }
        position: { type: integer, minimum: 0 }
    CourseMaterial:
      type: object
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        kind: { $ref: "#/components/schemas/CourseMaterialKind" }
        externalUrl: { type: ["string", "null"], format: uri }
        objectPath: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        contentType: { type: ["string", "null"] }
        fileSize: { type: ["integer", "null"] }
        allowedRoles:
          type: array
          items: { $ref: "#/components/schemas/CourseMaterialRole" }
        position: { type: integer }
      required: [id, moduleId, title, description, kind, externalUrl, objectPath, fileName, contentType, fileSize, allowedRoles, position]
    CourseModule:
      type: object
      properties:
        id: { type: integer }
        programId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        position: { type: integer }
        releaseAt: { type: ["string", "null"], format: date-time }
        isPublished: { type: boolean }
        materials:
          type: array
          items: { $ref: "#/components/schemas/CourseMaterial" }
      required: [id, programId, title, description, position, releaseAt, isPublished, materials]
    CourseProgram:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        modules:
          type: array
          items: { $ref: "#/components/schemas/CourseModule" }
      required: [id, name, modules]
    CourseManagement:
      type: object
