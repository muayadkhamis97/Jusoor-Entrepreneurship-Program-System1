        programId: { type: ["integer", "null"] }
        programName: { type: ["string", "null"] }
        kind: { $ref: "#/components/schemas/AnnouncementKind" }
        title: { type: string }
        body: { type: string }
        scheduledFor: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
      required: [id, programId, programName, kind, title, body, scheduledFor, createdAt, readAt]
    ParticipantDashboard:
      type: object
      properties:
        applications:
          type: array
          items: { $ref: "#/components/schemas/ParticipantEnrollment" }
        announcements:
          type: array
