openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Program management for the Jusoor Entrepreneurship Program
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: programs
    description: Program projects and cohorts
  - name: businesses
    description: Applicants and businesses through the program pipeline
  - name: applications
    description: Public intake, coordinator review, and founder progress
  - name: participants
    description: Founder self-service access to application and program progress
  - name: sessions
    description: Training and event sessions
  - name: support
    description: Mentoring, expert, and agency support
  - name: pitches
    description: Pitch-day and grant decisions
  - name: dashboard
    description: Program overview
  - name: auth
    description: Staff identity and access
  - name: staff
    description: Coordinator-managed team access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get program dashboard overview
      responses:
        "200":
          description: Dashboard totals and upcoming activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List program projects
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a program project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /programs/{id}:
    patch:
      operationId: updateProgram
      tags: [programs]
      summary: Update a program project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Program not found
    delete:
      operationId: deleteProgram
      tags: [programs]
      summary: Delete a program project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Program deleted
        "404":
          description: Program not found
  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List and filter applicants and businesses
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/BusinessStage"
        - name: programId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Add an applicant or business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get a business record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not found
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update applicant, business, or program stage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not found
    delete:
      operationId: deleteBusiness
      tags: [businesses]
      summary: Delete a business record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Business deleted
        "404":
          description: Business not found
  /public/application-programs:
    get:
      operationId: listApplicationPrograms
      tags: [applications]
      summary: List programs currently accepting applications
      responses:
        "200":
          description: Open programs with public application details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationProgram"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List submitted applications for coordinator review
      responses:
        "200":
          description: Applications with coordinator-only review notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntrepreneurApplication"
        "403":
          description: Staff access required
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a public program application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntrepreneurApplicationInput"
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
        "400":
          description: Invalid application
        "409":
          description: The email already has an application for this program
  /applications/{id}:
    patch:
      operationId: reviewApplication
      tags: [applications]
      summary: Record a coordinator decision on an application
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationReviewUpdate"
      responses:
        "200":
          description: Updated application review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntrepreneurApplication"
        "400":
          description: Invalid review decision
        "404":
          description: Application not found
        "409":
          description: A final decision has already been recorded
        "403":
          description: Coordinator access required
  /participant/dashboard:
    get:
      operationId: getParticipantDashboard
      tags: [participants]
      summary: Get the signed-in participant's applications and program progress
      responses:
        "200":
          description: Applications, approved-program sessions, and assigned support
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDashboard"
        "401":
          description: Sign in required
        "403":
          description: No application is linked to this account
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List training sessions and program events
      parameters:
        - name: programId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/SessionType"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Schedule a session or program event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{id}:
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a session, Zoom link, or recording
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Session deleted
        "404":
          description: Session not found
  /support:
    get:
      operationId: listSupport
      tags: [support]
      summary: List mentoring, expert, and agency support
      parameters:
        - name: businessId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/SupportType"
      responses:
        "200":
          description: Support engagements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportEngagement"
    post:
      operationId: createSupport
      tags: [support]
      summary: Add a support engagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportInput"
      responses:
        "201":
          description: Created support engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportEngagement"
  /support/{id}:
    patch:
      operationId: updateSupport
      tags: [support]
      summary: Update a support engagement
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportUpdate"
      responses:
        "200":
          description: Updated support engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportEngagement"
        "404":
          description: Support engagement not found
    delete:
      operationId: deleteSupport
      tags: [support]
      summary: Delete a support engagement
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Support engagement deleted
        "404":
          description: Support engagement not found
  /pitches:
    get:
      operationId: listPitches
      tags: [pitches]
      summary: List pitch-day and demo-day evaluations and grant decisions
      parameters:
        - name: businessId
          in: query
          schema:
            type: integer
        - name: eventType
          in: query
          schema:
            $ref: "#/components/schemas/PitchEventType"
      responses:
        "200":
          description: Pitch records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PitchRecord"
    post:
      operationId: createPitch
      tags: [pitches]
      summary: Record a pitch evaluation or grant decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PitchInput"
      responses:
        "201":
          description: Created pitch record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchRecord"
  /pitches/{id}:
    patch:
      operationId: updatePitch
      tags: [pitches]
      summary: Update a pitch evaluation or grant decision
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PitchUpdate"
      responses:
        "200":
          description: Updated pitch record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchRecord"
        "404":
          description: Pitch record not found
    delete:
      operationId: deletePitch
      tags: [pitches]
      summary: Delete a pitch record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Pitch record deleted
        "404":
          description: Pitch record not found
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current staff profile
      responses:
        "200":
          description: Current staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          description: Sign-in required
        "403":
          description: Account is not approved for staff access
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List approved staff and pending invitations
      responses:
        "200":
          description: Staff access records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "403":
          description: Coordinator role required
    post:
      operationId: createStaff
      tags: [staff]
      summary: Approve a staff email and assign a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff access approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "409":
          description: Email already has access
        "403":
          description: Coordinator role required
  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Change a staff member's role
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid role change
        "404":
          description: Staff member not found
        "403":
          description: Coordinator role required
    delete:
      operationId: deleteStaff
      tags: [staff]
      summary: Revoke a staff member's access
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Access revoked
        "400":
          description: Cannot revoke your own access or the last coordinator
        "404":
          description: Staff member not found
        "403":
          description: Coordinator role required
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApplicationStatus:
      type: string
      enum: [submitted, under_review, accepted, declined]
    ApplicationReviewStatus:
      type: string
      enum: [under_review, accepted, declined]
    ApplicationProgram:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        format: { type: string, enum: [bootcamp, hackathon] }
        description: { type: ["string", "null"] }
        applicationDeadline: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      required: [id, name, format]
    EntrepreneurApplication:
      type: object
      properties:
        id: { type: integer }
        programId: { type: integer }
        programName: { type: string }
        founderName: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        businessName: { type: string }
        industry: { type: ["string", "null"] }
        website: { type: ["string", "null"], format: uri }
        summary: { type: string }
        supportNeeds: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        reviewNotes: { type: ["string", "null"] }
        businessId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, programId, programName, founderName, email, phone, businessName, industry, website, summary, supportNeeds, status, reviewNotes, businessId, createdAt]
    EntrepreneurApplicationInput:
      type: object
      properties:
        programId: { type: integer }
        founderName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 50 }
        businessName: { type: string, minLength: 2, maxLength: 180 }
        industry: { type: ["string", "null"], maxLength: 120 }
        website: { type: ["string", "null"], format: uri, maxLength: 500 }
        summary: { type: string, minLength: 30, maxLength: 3000 }
        supportNeeds: { type: string, minLength: 10, maxLength: 1500 }
      required: [programId, founderName, email, businessName, summary, supportNeeds]
    ApplicationReceipt:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, status, createdAt]
    ApplicationReviewUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ApplicationReviewStatus" }
        reviewNotes: { type: ["string", "null"], maxLength: 3000 }
      required: [status]
    ParticipantBusiness:
      type: object
      properties:
        id: { type: integer }
        businessName: { type: string }
        industry: { type: ["string", "null"] }
        stage: { $ref: "#/components/schemas/BusinessStage" }
      required: [id, businessName, industry, stage]
    ParticipantProgram:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        format: { type: string, enum: [bootcamp, hackathon] }
        description: { type: ["string", "null"] }
        startDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        endDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      required: [id, name, format, description, startDate, endDate]
    ParticipantSession:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/SessionType" }
        scheduledDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        startTime: { type: ["string", "null"] }
        facilitator: { type: ["string", "null"] }
        deliveryMode: { $ref: "#/components/schemas/DeliveryMode" }
        location: { type: ["string", "null"] }
        zoomUrl: { type: ["string", "null"], format: uri }
        recordingUrl: { type: ["string", "null"], format: uri }
        status: { type: string, enum: [scheduled, completed, cancelled] }
      required: [id, title, type, scheduledDate, startTime, facilitator, deliveryMode, location, zoomUrl, recordingUrl, status]
    ParticipantSupport:
      type: object
      properties:
        id: { type: integer }
        type: { $ref: "#/components/schemas/SupportType" }
        provider: { type: string }
        topic: { type: string }
        scheduledDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        status: { $ref: "#/components/schemas/SupportStatus" }
      required: [id, type, provider, topic, scheduledDate, status]
    ParticipantEnrollment:
      type: object
      properties:
        applicationId: { type: integer }
        applicationStatus: { $ref: "#/components/schemas/ApplicationStatus" }
        submittedAt: { type: string, format: date-time }
        program: { $ref: "#/components/schemas/ParticipantProgram" }
        business: { anyOf: [{ $ref: "#/components/schemas/ParticipantBusiness" }, { type: "null" }] }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ParticipantSession" }
        support:
          type: array
          items: { $ref: "#/components/schemas/ParticipantSupport" }
      required: [applicationId, applicationStatus, submittedAt, program, business, sessions, support]
    ParticipantDashboard:
      type: object
      properties:
        applications:
          type: array
          items: { $ref: "#/components/schemas/ParticipantEnrollment" }
      required: [applications]
    StaffRole:
      type: string
      enum: [coordinator, staff]
    StaffStatus:
      type: string
      enum: [invited, active]
    StaffMember:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/StaffRole" }
        status: { $ref: "#/components/schemas/StaffStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, email, role, status, createdAt]
    StaffInput:
      type: object
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/StaffRole" }
      required: [email, role]
    StaffUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/StaffRole" }
      required: [role]
    BusinessStage:
      type: string
      enum: [application, bootcamp, incubator, pitch, demo_day, grant_awarded, alumni, declined]
    SessionType:
      type: string
      enum: [bootcamp, hackathon, training, pitch_day, demo_day, other]
    DeliveryMode:
      type: string
      enum: [online, in_person, hybrid]
    SupportType:
      type: string
      enum: [mentor, subject_expert, branding, technical]
    SupportStatus:
      type: string
      enum: [requested, matched, scheduled, completed]
    PitchEventType:
      type: string
      enum: [pitch_day, demo_day]
    GrantDecision:
      type: string
      enum: [pending, awarded, not_awarded]
    Program:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        format: { type: string, enum: [bootcamp, hackathon] }
        description: { type: ["string", "null"] }
        startDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        endDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        applicationDeadline: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        status: { type: string, enum: [planning, outreach, active, completed] }
        createdAt: { type: string, format: date-time }
      required: [id, name, format, status, createdAt]
    ProgramInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        format: { type: string, enum: [bootcamp, hackathon] }
        description: { type: ["string", "null"] }
        startDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        endDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        applicationDeadline: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        status: { type: string, enum: [planning, outreach, active, completed] }
      required: [name, format]
    ProgramUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        format: { type: string, enum: [bootcamp, hackathon] }
        description: { type: ["string", "null"] }
        startDate: { type: ["string", "null"], format: date }
        endDate: { type: ["string", "null"], format: date }
        applicationDeadline: { type: ["string", "null"], format: date }
        status: { type: string, enum: [planning, outreach, active, completed] }
    Business:
      type: object
      properties:
        id: { type: integer }
        programId: { type: integer }
        businessName: { type: string }
        founderName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        stage: { $ref: "#/components/schemas/BusinessStage" }
        applicationDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        needs: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, programId, businessName, founderName, email, stage, createdAt]
    BusinessInput:
      type: object
      properties:
        programId: { type: integer }
        businessName: { type: string, minLength: 1 }
        founderName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        stage: { $ref: "#/components/schemas/BusinessStage" }
        applicationDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        needs: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required: [programId, businessName, founderName, email]
    BusinessUpdate:
      type: object
      properties:
        programId: { type: integer }
        businessName: { type: string, minLength: 1 }
