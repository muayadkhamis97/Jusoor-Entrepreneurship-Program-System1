    post:
      operationId: submitPublicJudgingResponse
      summary: Submit one business assessment with required self-reported judge name and email
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JudgingResponseInput" }
      responses:
        "200":
          description: Accepted assessment or safe retry of the same assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JudgingSubmissionReceipt" }
  /staff/google-sheets:
    get:
      operationId: getProgramGoogleSheetsStatuses
      tags: [staff]
      summary: List Google Sheets destinations visible to this staff account
      responses:
        "200":
          description: Google Sheets destinations for active programs in the staff member's scope
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgramGoogleSheetsStatus" }
        "403":
          description: Admin or program staff access required
  /staff/google-sheets/{programId}:
    post:
      operationId: createProgramGoogleSheetsConnection
      tags: [staff]
      summary: Create or link a program workbook and queue its initial sync
      description: Choose a new workbook or an accessible existing spreadsheet and map each data category to its own worksheet tab.
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramGoogleSheetsConnectionInput" }
      responses:
        "200":
          description: Workbook destination updated and sync queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramGoogleSheetsStatus" }
        "201":
          description: New workbook created; existing program records are queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramGoogleSheetsStatus" }
        "400":
          description: Invalid workbook choice or worksheet mapping
        "404":
          description: Program not found or outside the staff member's scope
        "502":
          description: The connected Google account could not access or create the workbook
    delete:
      operationId: disconnectProgramGoogleSheets
      tags: [staff]
      summary: Unlink a program's Google Sheets workbook without deleting the external file
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "204":
          description: The workbook link was removed; the external Google file and platform records remain
        "403":
          description: Coordinator role required
        "404":
          description: Program workbook not found
  /staff/google-sheets/{programId}/destination-history:
    get:
      operationId: getProgramGoogleSheetsDestinationHistory
      tags: [staff]
      summary: Review changes to a program's Google Sheets destination
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Workbook and worksheet mapping destination changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramGoogleSheetsDestinationHistoryPage" }
        "403":
          description: Coordinator role required
        "404":
          description: Program not found
  /staff/google-sheets/{programId}/workbooks:
    get:
      operationId: listProgramGoogleSheetsWorkbooks
      tags: [staff]
      summary: List spreadsheets available to the connected Google account
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: pageToken, in: query, required: false, schema: { type: string, maxLength: 4096 } }
      responses:
        "200":
          description: Matching spreadsheet files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleSheetsWorkbookList" }
        "404":
          description: Program not found or outside the staff member's scope
        "502":
          description: Google Drive could not list spreadsheets
  /staff/google-sheets/{programId}/workbooks/{spreadsheetId}/tabs:
    get:
      operationId: listProgramGoogleSheetsWorkbookTabs
      tags: [staff]
      summary: List worksheet tabs in an accessible spreadsheet
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - { name: spreadsheetId, in: path, required: true, schema: { type: string, minLength: 10, maxLength: 200, pattern: "^[A-Za-z0-9_-]+$" } }
      responses:
        "200":
          description: Worksheet tabs in the selected spreadsheet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoogleSheetsTab" }
        "404":
          description: Program or spreadsheet is unavailable
        "502":
          description: Google Sheets could not read worksheet tabs
  /staff/google-sheets/{programId}/sheet-mappings:
    patch:
      operationId: updateProgramGoogleSheetsSheetMappings
      tags: [staff]
      summary: Save worksheet tabs for a connected program workbook
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramGoogleSheetsSheetMappingsInput" }
      responses:
        "200":
          description: Worksheet mappings saved and the selected data queued for refresh
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramGoogleSheetsStatus" }
        "400":
          description: Invalid worksheet mapping
        "404":
          description: Program workbook or selected worksheet is unavailable
  /staff/google-sheets/{programId}/categories:
    patch:
      operationId: updateProgramGoogleSheetsCategories
      tags: [staff]
      summary: Update exported data categories for one program workbook
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramGoogleSheetsExportCategoriesInput" }
      responses:
        "200":
          description: Per-program category export settings were saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramGoogleSheetsStatus" }
        "400":
          description: Export category settings are invalid
        "404":
          description: Program is unavailable, outside scope, or has no workbook
  /staff/google-sheets/{programId}/sync:
    post:
      operationId: retryProgramGoogleSheetsSync
      tags: [staff]
      summary: Retry failed program-record synchronization
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Failed items have been queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramGoogleSheetsStatus" }
        "404":
          description: Program is unavailable or has no workbook

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    IntegrationApiKey:
      type: http
      scheme: bearer
      bearerFormat: Program integration key
  schemas:
    AnnouncementReplyInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    AnnouncementReplyReadInput:
      type: object
      required: [throughId]
      properties:
        throughId: { type: integer, minimum: 1 }
    AnnouncementReply:
      type: object
      required: [id, sender, body, createdAt, readAt]
      properties:
        id: { type: integer }
        sender: { type: string, enum: [participant, staff] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
    AnnouncementConversation:
      type: object
      required: [applicationId, programName, participantName, businessName, unreadCount, messages]
      properties:
        applicationId: { type: integer }
        programName: { type: string }
        participantName: { type: string }
        businessName: { type: ["string", "null"] }
        unreadCount: { type: integer }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AnnouncementReply" }
    ProgramGoogleSheetsStatus:
      type: object
      required:
        - programId
        - programName
        - status
        - spreadsheetId
        - spreadsheetUrl
        - spreadsheetTitle
        - connectedAt
        - lastSyncedAt
        - lastError
        - pendingCount
        - failedCount
        - exportCategories
        - sheetMappings
      properties:
        programId: { type: integer }
        programName: { type: string }
        status: { type: string, enum: [not_connected, syncing, connected, needs_attention] }
        spreadsheetId: { type: [string, "null"] }
        spreadsheetUrl: { type: [string, "null"], format: uri }
        spreadsheetTitle: { type: [string, "null"] }
        connectedAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
        pendingCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        exportCategories: { $ref: "#/components/schemas/ProgramGoogleSheetsExportCategories" }
        sheetMappings: { $ref: "#/components/schemas/ProgramGoogleSheetsSheetMappings" }
    ProgramGoogleSheetsDestinationHistory:
      type: object
      additionalProperties: false
      required:
        - id
        - programId
        - programName
        - actorStaffId
        - actorEmail
        - previousSpreadsheetId
        - previousSpreadsheetTitle
        - previousSheetMappings
        - newSpreadsheetId
        - newSpreadsheetTitle
        - newSheetMappings
        - createdAt
      properties:
        id: { type: integer }
        programId: { type: integer }
        programName: { type: string }
        actorStaffId: { type: ["integer", "null"] }
        actorEmail: { type: string }
        previousSpreadsheetId: { type: ["string", "null"] }
        previousSpreadsheetTitle: { type: ["string", "null"] }
        previousSheetMappings:
          anyOf:
            - $ref: "#/components/schemas/ProgramGoogleSheetsSheetMappings"
            - type: "null"
        newSpreadsheetId: { type: string }
        newSpreadsheetTitle: { type: string }
        newSheetMappings: { $ref: "#/components/schemas/ProgramGoogleSheetsSheetMappings" }
        createdAt: { type: string, format: date-time }
    ProgramGoogleSheetsDestinationHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProgramGoogleSheetsDestinationHistory" }
        nextCursor: { type: ["string", "null"] }
    GoogleSheetsWorkbookList:
      type: object
      additionalProperties: false
      required: [items, nextPageToken]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GoogleSheetsWorkbook" }
        nextPageToken: { type: ["string", "null"] }
    GoogleSheetsWorkbook:
      type: object
      additionalProperties: false
      required: [spreadsheetId, title, url]
      properties:
        spreadsheetId: { type: string, minLength: 10, maxLength: 200 }
        title: { type: string }
        url: { type: ["string", "null"], format: uri }
        modifiedAt: { type: ["string", "null"], format: date-time }
    GoogleSheetsTab:
      type: object
      additionalProperties: false
      required: [sheetId, title]
      properties:
        sheetId: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 100 }
    ProgramGoogleSheetsConnectionInput:
      type: object
      additionalProperties: false
      required: [mode, sheetMappings]
      properties:
        mode: { type: string, enum: [create, existing] }
        spreadsheetId: { type: string, minLength: 10, maxLength: 200, pattern: "^[A-Za-z0-9_-]+$" }
        sheetMappings: { $ref: "#/components/schemas/ProgramGoogleSheetsSheetMappings" }
        confirmedOverwrite: { type: boolean }
    ProgramGoogleSheetsSheetMappings:
      type: object
      additionalProperties: false
      required: [applications, judgingResponses, businessTeam, operations, mentoringGrants, chats]
      properties:
        applications: { type: string, minLength: 1, maxLength: 100 }
        judgingResponses: { type: string, minLength: 1, maxLength: 100 }
        businessTeam: { type: string, minLength: 1, maxLength: 100 }
        operations: { type: string, minLength: 1, maxLength: 100 }
        mentoringGrants: { type: string, minLength: 1, maxLength: 100 }
        chats: { type: string, minLength: 1, maxLength: 100 }
    ProgramGoogleSheetsSheetMappingsInput:
      type: object
      additionalProperties: false
      required: [sheetMappings, confirmedOverwrite]
      properties:
        sheetMappings: { $ref: "#/components/schemas/ProgramGoogleSheetsSheetMappings" }
        confirmedOverwrite: { type: boolean, enum: [true] }
    ProgramGoogleSheetsExportCategories:
      type: object
      additionalProperties: false
      required: [businessTeam, operations, mentoringGrants, chats]
      properties:
        businessTeam: { type: boolean }
        operations: { type: boolean }
        mentoringGrants: { type: boolean }
        chats: { type: boolean }
    ProgramGoogleSheetsExportCategoriesInput:
      type: object
      additionalProperties: false
      required: [exportCategories]
      properties:
        exportCategories: { $ref: "#/components/schemas/ProgramGoogleSheetsExportCategories" }
    JudgingCriterion:
      type: object
      required: [id, label, description, maxScore]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        maxScore: { type: integer, minimum: 1, maximum: 100 }
    JudgingQuestion:
      type: object
      required: [id, label, required]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 500 }
        required: { type: boolean }
    JudgingBusiness:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    JudgingFormBusinessCoverage:
      type: object
      required: [id, name, assessmentCount]
      properties:
        id: { type: integer }
        name: { type: string }
        assessmentCount: { type: integer, minimum: 0 }
    JudgingFormInput:
      type: object
      required: [programId, title, instructions, businessIds, criteria, questions]
      properties:
        programId: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, maxLength: 5000 }
        businessIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer, minimum: 1 } }
        criteria: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/JudgingCriterion" } }
        questions: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/JudgingQuestion" } }
    JudgingFormStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, closed] }
    JudgingFormSummary:
      type: object
      required: [id, programId, programName, title, status, responseCount, publishedAt]
      properties:
        id: { type: integer }
        programId: { type: integer }
        programName: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, open, closed] }
        responseCount: { type: integer }
        publishedAt: { type: [string, "null"], format: date-time }
    JudgingFormDetail:
      allOf:
        - { $ref: "#/components/schemas/JudgingFormSummary" }
        - type: object
          required: [instructions, criteria, questions, businesses, shareToken]
          properties:
            instructions: { type: string }
            criteria: { type: array, items: { $ref: "#/components/schemas/JudgingCriterion" } }
            questions: { type: array, items: { $ref: "#/components/schemas/JudgingQuestion" } }
            businesses: { type: array, items: { $ref: "#/components/schemas/JudgingFormBusinessCoverage" } }
            shareToken: { type: [string, "null"] }
    JudgingFormLinkHistoryEntry:
      type: object
      required: [id, actorEmail, replacedAt]
      properties:
        id: { type: integer }
        actorEmail: { type: string }
        replacedAt: { type: string, format: date-time }
    JudgingFormStatusHistoryEntry:
      type: object
      required: [id, actorEmail, fromStatus, toStatus, changedAt]
      properties:
        id: { type: integer }
        actorEmail: { type: string }
        fromStatus: { type: string, enum: [draft, open, closed] }
        toStatus: { type: string, enum: [draft, open, closed] }
        changedAt: { type: string, format: date-time }
    PublicJudgingForm:
      type: object
      required: [id, title, instructions, programName, criteria, questions, businesses]
      properties:
        id: { type: integer }
        title: { type: string }
        instructions: { type: string }
        programName: { type: string }
        criteria: { type: array, items: { $ref: "#/components/schemas/JudgingCriterion" } }
        questions: { type: array, items: { $ref: "#/components/schemas/JudgingQuestion" } }
        businesses: { type: array, items: { $ref: "#/components/schemas/JudgingBusiness" } }
    JudgingScore:
      type: object
      required: [criterionId, score]
      properties:
        criterionId: { type: string, format: uuid }
        score: { type: number, minimum: 0 }
    JudgingAnswer:
      type: object
      required: [questionId, text]
      properties:
        questionId: { type: string, format: uuid }
        text: { type: string, maxLength: 4000 }
    JudgingResponseInput:
      type: object
      required: [businessId, judgeName, judgeEmail, scores, answers, clientSubmissionId]
      properties:
        businessId: { type: integer, minimum: 1 }
        judgeName: { type: string, minLength: 1, maxLength: 150 }
        judgeEmail: { type: string, format: email, maxLength: 254 }
        scores: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/JudgingScore" } }
        answers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/JudgingAnswer" } }
        clientSubmissionId: { type: string, format: uuid }
    JudgingSubmissionReceipt:
      type: object
      required: [received, businessName, scoreTotal, maxScore]
      properties:
        received: { type: boolean }
        businessName: { type: string }
        scoreTotal: { type: number }
        maxScore: { type: number }
    JudgingResponse:
      type: object
      required: [id, businessId, businessName, judgeName, judgeEmail, scores, answers, scoreTotal, maxScore, submittedAt]
      properties:
        id: { type: integer }
        businessId: { type: integer }
        businessName: { type: string }
        judgeName: { type: string }
        judgeEmail: { type: string }
        scores: { type: array, items: { $ref: "#/components/schemas/JudgingScore" } }
        answers: { type: array, items: { $ref: "#/components/schemas/JudgingAnswer" } }
        scoreTotal: { type: number }
        maxScore: { type: number }
        submittedAt: { type: string, format: date-time }
    JudgingResponsePage:
      type: object
      required: [responses, nextBeforeId]
      properties:
        responses: { type: array, items: { $ref: "#/components/schemas/JudgingResponse" } }
        nextBeforeId: { type: [integer, "null"] }
    ChatTarget:
      type: object
      required: [programId, programName, kind, targetId, name]
      properties:
        programId: { type: integer }
        programName: { type: string }
        kind: { type: string, enum: [private, business] }
        targetId: { type: integer }
        name: { type: string }
    ChatThreadInput:
      type: object
      required: [programId, kind, targetId]
      properties:
        programId: { type: integer, minimum: 1 }
        kind: { type: string, enum: [private, business] }
        targetId: { type: integer, minimum: 1 }
    ChatThread:
      type: object
      required: [id, programId, programName, kind, title, lastMessage, lastMessageAt, unreadCount]
      properties:
        id: { type: integer }
        programId: { type: integer }
        programName: { type: string }
        kind: { type: string, enum: [private, business] }
        title: { type: string }
        lastMessage: { type: [string, "null"] }
        lastMessageAt: { type: [string, "null"], format: date-time }
        unreadCount: { type: integer }
    ChatMessageInput:
      type: object
      required: [body, clientMessageId]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        clientMessageId: { type: string, format: uuid }
    ChatMessage:
      type: object
      required: [id, threadId, body, senderName, senderRole, isOwn, createdAt]
      properties:
        id: { type: integer }
        threadId: { type: integer }
        body: { type: string }
        senderName: { type: string }
        senderRole: { type: string, enum: [staff, participant] }
        isOwn: { type: boolean }
        createdAt: { type: string, format: date-time }
    ChatMessagePage:
      type: object
      required: [messages, nextBeforeId]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        nextBeforeId: { type: [integer, "null"] }
    ChatReadInput:
      type: object
      required: [lastReadMessageId]
      properties:
        lastReadMessageId: { type: integer, minimum: 1 }
    IntegrationApiKeyInput:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        programId: { type: integer, minimum: 1 }
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/IntegrationApiPermission" }
      required: [label, programId, permissions]
    IntegrationApiKey:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        keyPrefix: { type: string }
        programId: { type: integer }
        programName: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/IntegrationApiPermission" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
      required: [id, label, keyPrefix, programId, programName, permissions, createdAt, lastUsedAt, revokedAt]
    IntegrationApiKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/IntegrationApiKey" }
      required: [keys]
    IntegrationApiKeyCreated:
      type: object
      properties:
        key: { $ref: "#/components/schemas/IntegrationApiKey" }
        secret:
          type: string
          description: One-time bearer secret. Store it securely; it cannot be retrieved later.
      required: [key, secret]
    IntegrationApiKeyRevocation:
      type: object
      properties:
        id: { type: integer }
        revokedAt: { type: string, format: date-time }
      required: [id, revokedAt]
    IntegrationApiPermission:
      type: string
      enum:
        - programs_sessions:read
        - programs_sessions:write
        - applications_businesses:read
        - applications_businesses:write
        - courses_attendance:read
        - courses_attendance:write
        - mentoring_grants:read
        - mentoring_grants:write
    IntegrationApiResource:
      type: string
      enum: [applications, businesses, sessions, course-modules, attendance, learning-progress, mentoring, pitches, grant-receipts]
    IntegrationApiRecordInput:
      type: object
      minProperties: 1
      additionalProperties: true
      description: The resource-specific fields are listed in the coordinator API guide. Program IDs are always derived from the API key scope.
    IntegrationApiRecord:
      type: object
      additionalProperties: true
    IntegrationApiRecordsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntegrationApiRecord" }
      required: [items]
    IntegrationApiRecordResponse:
      type: object
      properties:
        item: { $ref: "#/components/schemas/IntegrationApiRecord" }
      required: [item]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProgramBranding:
      type: object
      properties:
        brandName: { type: string }
        logoUrl: { type: ["string", "null"], format: uri, maxLength: 2048 }
        primaryColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        sidebarColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        topbarColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
      required: [brandName, logoUrl, primaryColor, accentColor, sidebarColor, topbarColor]
    ProgramBrandingInput:
      type: object
      properties:
        brandName: { type: string, minLength: 1, maxLength: 80 }
        logoUrl: { type: ["string", "null"], format: uri, maxLength: 2048 }
        primaryColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        sidebarColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        topbarColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
      required: [brandName, logoUrl, primaryColor, accentColor]
    BrandLogoUploadInput:
      type: object
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
      required: [contentType, size]
    BrandLogoUploadResponse:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        logoUrl: { type: string, format: uri, minLength: 1, maxLength: 2048 }
      required: [uploadUrl, logoUrl]
