      required: [applications, announcements]
    ParticipantAssignment:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        instructions: { type: string }
        dueDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        sessionTitle: { type: ["string", "null"] }
        answer: { type: ["string", "null"] }
        status: { type: ["string", "null"], enum: [submitted, reviewed, null] }
        score: { type: ["number", "null"] }
        feedback: { type: ["string", "null"] }
