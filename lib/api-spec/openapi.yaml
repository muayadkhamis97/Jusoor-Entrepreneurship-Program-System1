      parameters:
        - { in: header, name: Authorization, required: true, schema: { type: string } }
        - { in: header, name: X-Experience-API-Version, required: true, schema: { type: string, enum: ["1.0.3"] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/XapiStatement" }
                - type: array
                  items: { $ref: "#/components/schemas/XapiStatement" }
      responses:
        "200":
          description: IDs of the statements stored
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        "400":
          description: Invalid statement payload
        "401":
          description: Missing, invalid, or expired package launch credentials
    put:
      operationId: putXapiStatement
      tags: [xapi]
      summary: Store a statement using its caller-supplied UUID
      parameters:
        - { in: header, name: Authorization, required: true, schema: { type: string } }
        - { in: header, name: X-Experience-API-Version, required: true, schema: { type: string, enum: ["1.0.3"] } }
        - { in: query, name: statementId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XapiStatement" }
      responses:
        "204":
          description: Statement stored
        "409":
          description: Statement ID already exists with different content
        "401":
          description: Missing, invalid, or expired package launch credentials
