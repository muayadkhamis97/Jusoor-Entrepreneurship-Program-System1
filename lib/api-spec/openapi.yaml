openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Program management for the Jusoor Entrepreneurship Program
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: programs
    description: Program projects and cohorts
  - name: businesses
    description: Applicants and businesses through the program pipeline
  - name: applications
    description: Public intake, coordinator review, and founder progress
  - name: participants
    description: Founder self-service access to application and program progress
  - name: sessions
    description: Training and event sessions
  - name: support
    description: Mentoring, expert, and agency support
  - name: pitches
    description: Pitch-day and grant decisions
  - name: dashboard
    description: Program overview
  - name: auth
    description: Staff identity and access
  - name: staff
    description: Coordinator-managed team access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get program dashboard overview
      responses:
        "200":
          description: Dashboard totals and upcoming activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List program projects
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a program project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /programs/{id}:
    patch:
      operationId: updateProgram
      tags: [programs]
      summary: Update a program project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Program not found
    delete:
      operationId: deleteProgram
      tags: [programs]
      summary: Delete a program project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Program deleted
        "404":
          description: Program not found
  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List and filter applicants and businesses
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/BusinessStage"
        - name: programId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Add an applicant or business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get a business record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not found
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update applicant, business, or program stage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not found
    delete:
      operationId: deleteBusiness
      tags: [businesses]
      summary: Delete a business record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Business deleted
        "404":
          description: Business not found
  /public/application-programs:
    get:
      operationId: listApplicationPrograms
      tags: [applications]
      summary: List programs currently accepting applications
      responses:
        "200":
          description: Open programs with public application details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationProgram"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List submitted applications for coordinator review
      responses:
        "200":
          description: Applications with coordinator-only review notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntrepreneurApplication"
        "403":
          description: Staff access required
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a public program application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntrepreneurApplicationInput"
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
        "400":
          description: Invalid application
        "409":
          description: The email already has an application for this program
  /applications/{id}:
    patch:
      operationId: reviewApplication
      tags: [applications]
      summary: Record a coordinator decision on an application
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationReviewUpdate"
      responses:
        "200":
          description: Updated application review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntrepreneurApplication"
        "400":
          description: Invalid review decision
        "404":
          description: Application not found
        "409":
          description: A final decision has already been recorded
        "403":
          description: Coordinator access required
  /courses/management:
    get:
      operationId: getCourseManagement
      tags: [courses]
      summary: Get course modules and materials for programs the signed-in coordinator or trainer can manage
      responses:
        "200":
          description: Manageable programs and their course content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseManagement"
        "403":
          description: Coordinator or assigned trainer access required
  /courses/modules:
    post:
      operationId: createCourseModule
      tags: [courses]
      summary: Create a course module for a manageable program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseModuleInput"
      responses:
        "201":
          description: Created course module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseModule"
        "403":
          description: Program is not assigned to this trainer
  /courses/modules/{id}:
    patch:
      operationId: updateCourseModule
      tags: [courses]
      summary: Update module details, publication status, or release time
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseModuleUpdate"
      responses:
        "200":
          description: Updated course module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseModule"
        "404":
          description: Module not found in a manageable program
    delete:
      operationId: deleteCourseModule
      tags: [courses]
      summary: Delete a module and its materials
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Module deleted
        "404":
          description: Module not found in a manageable program
  /courses/modules/{id}/materials:
    post:
      operationId: createCourseMaterial
      tags: [courses]
      summary: Add a private upload or external resource to a course module
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseMaterialInput"
      responses:
        "201":
          description: Created course material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseMaterial"
        "403":
          description: Module is not in a manageable program
  /courses/materials/{id}:
    patch:
      operationId: updateCourseMaterial
      tags: [courses]
      summary: Update material details or its role access
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseMaterialUpdate"
      responses:
        "200":
          description: Updated course material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseMaterial"
        "404":
          description: Material not found in a manageable program
    delete:
      operationId: deleteCourseMaterial
      tags: [courses]
      summary: Delete a course material
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Material deleted
        "404":
          description: Material not found in a manageable program
  /courses/uploads/request-url:
    post:
      operationId: requestCourseUploadUrl
      tags: [courses]
      summary: Request a short-lived upload URL for a private course file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUploadInput"
      responses:
        "200":
          description: Presigned upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseUploadUrl"
        "400":
          description: Unsupported file type or size
        "403":
          description: Program is not manageable by this account
  /courses/materials/{id}/file:
    get:
      operationId: getCourseMaterialFile
      tags: [courses]
      summary: Stream a private course file to an authorized staff member
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Private course file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Role is not allowed to access this material
        "404":
          description: File not found
  /participant/courses:
    get:
      operationId: getParticipantCourses
      tags: [courses]
      summary: Get published course modules for the signed-in participant's accepted programs
      responses:
        "200":
          description: Published and released learning materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantCourses"
        "403":
          description: No application is linked to this account
  /participant/courses/materials/{id}/file:
    get:
      operationId: getParticipantCourseMaterialFile
      tags: [courses]
      summary: Stream a private course file after checking enrollment, release, and role access
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Private course file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Participant is not enrolled or the material is restricted
        "404":
          description: File not found
  /participant/dashboard:
    get:
      operationId: getParticipantDashboard
      tags: [participants]
      summary: Get the signed-in participant's applications and program progress
      responses:
        "200":
          description: Applications, approved-program sessions, and assigned support
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDashboard"
        "401":
          description: Sign in required
        "403":
          description: No application is linked to this account
  /participant/announcements/{id}/read:
    post:
      operationId: markAnnouncementRead
      tags: [participants]
      summary: Mark a cohort announcement as read by the signed-in participant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Read receipt saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementReadResult"
        "401":
          description: Sign in required
        "403":
          description: Announcement is not available to this participant
        "404":
          description: Announcement not found
  /participant/assignments/{id}/submission:
    post:
      operationId: submitTrainingAnswer
      tags: [participants]
      summary: Submit or update an answer to an assigned training activity
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswerInput"
      responses:
        "200":
          description: Saved participant answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSubmission"
        "403":
          description: Assignment is not part of this participant's cohort
  /participant/questions:
    post:
      operationId: askTrainingQuestion
      tags: [participants]
      summary: Ask a question about a cohort session or assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionInput"
      responses:
        "201":
          description: Question sent to the assigned trainer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantQuestion"
        "403":
          description: Program is not part of this participant's enrollment
  /trainer/dashboard:
    get:
      operationId: getTrainerDashboard
      tags: [sessions]
      summary: Get assigned sessions, activities, participant answers, and questions
      responses:
        "200":
          description: Trainer's assigned cohort work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerDashboard"
        "403":
          description: Trainer access required
  /trainer/assignments:
    post:
      operationId: createTrainingAssignment
      tags: [sessions]
      summary: Create an activity for a cohort assigned to the trainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAssignmentInput"
      responses:
        "201":
          description: Training assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAssignment"
        "403":
          description: Trainer is not assigned to this cohort
  /trainer/submissions/{id}:
    patch:
      operationId: reviewTrainingAnswer
      tags: [sessions]
      summary: Add a score and feedback to a participant's answer
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswerReview"
      responses:
        "200":
          description: Reviewed answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSubmission"
        "404":
          description: Answer not found in the trainer's assigned cohort
  /trainer/questions/{id}:
    patch:
      operationId: replyTrainingQuestion
      tags: [sessions]
      summary: Reply to a participant's question
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionReply"
      responses:
        "200":
          description: Question with trainer reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantQuestion"
        "404":
          description: Question not found in the trainer's assigned cohort
  /mentor/dashboard:
    get:
      operationId: getMentorDashboard
      tags: [support]
      summary: Get the mentor's assigned business support
      responses:
        "200":
          description: Assigned mentoring engagements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorDashboard"
        "403":
          description: Mentor access required
  /mentor/calendly/connect:
    post:
      operationId: startCalendlyConnection
      tags: [support]
      summary: Start the signed-in mentor's Calendly authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendlyAuthorizationInput"
      responses:
        "200":
          description: Calendly authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendlyAuthorization"
        "403":
          description: Mentor access required
        "503":
          description: Calendly OAuth is not configured
  /mentor/calendly/callback:
    get:
      operationId: completeCalendlyConnection
      tags: [support]
      summary: Complete a mentor's Calendly authorization
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the mentor workspace with the connection result
        "400":
          description: Authorization state is missing or invalid
  /mentor/calendly/webhook/{token}:
    post:
      operationId: receiveCalendlyWebhook
      tags: [support]
      summary: Receive signed Calendly booking updates
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendlyWebhookEnvelope"
      responses:
        "200":
          description: Event accepted or safely ignored
        "400":
          description: Invalid Calendly event
        "401":
          description: Invalid or expired webhook signature
  /mentor/google-calendar/connect:
    post:
      operationId: startGoogleCalendarConnection
      tags: [support]
      summary: Start the signed-in mentor's Google account authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarAuthorizationInput"
      responses:
        "200":
          description: Google authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendlyAuthorization"
        "403":
          description: Mentor access required
        "503":
          description: Google OAuth is not configured
  /mentor/google-calendar/callback:
    get:
      operationId: completeGoogleCalendarConnection
      tags: [support]
      summary: Complete a mentor's Google account authorization
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the mentor workspace with the connection result
        "400":
          description: Authorization state is missing or invalid
  /mentor/booking-settings:
    patch:
      operationId: updateMentorBookingSettings
      tags: [support]
      summary: Choose the booking provider and save the Google Calendar booking link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorBookingSettingsInput"
      responses:
        "200":
          description: Updated mentor booking settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorBookingSettings"
        "400":
          description: Provider is not connected or its booking link is invalid
        "403":
          description: Mentor access required
  /zoom/status:
    get:
      operationId: getZoomStatus
      tags: [sessions]
      summary: Get the coordinator's Zoom connection status and OAuth callback URL
      responses:
        "200":
          description: Zoom app setup and account connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoomStatus"
        "403":
          description: Coordinator access required
  /zoom/connect:
    post:
      operationId: startZoomConnection
      tags: [sessions]
      summary: Start coordinator authorization with Zoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoomConnectionInput"
      responses:
        "200":
          description: Zoom authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendlyAuthorization"
        "403":
          description: Coordinator access required
        "503":
          description: Zoom OAuth app credentials are not configured
  /zoom/callback:
    get:
      operationId: completeZoomConnection
      tags: [sessions]
      summary: Complete coordinator authorization with Zoom
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Sessions admin view
        "400":
          description: Authorization state is missing or invalid
  /zoom/disconnect:
    post:
      operationId: disconnectZoom
      tags: [sessions]
      summary: Remove the coordinator's Zoom authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoomConnectionInput"
      responses:
        "204":
          description: Zoom authorization removed
        "403":
          description: Coordinator access required
  /zoom/sessions/{id}/meeting:
    post:
      operationId: createOrUpdateZoomMeeting
      tags: [sessions]
      summary: Create or update the Zoom meeting for a program session
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated program session with its Zoom join link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Session cannot be scheduled as a Zoom meeting
        "403":
          description: Coordinator access required
        "404":
          description: Session not found
        "409":
          description: Zoom authorization is required
  /judge/dashboard:
    get:
      operationId: getJudgeDashboard
      tags: [pitches]
      summary: Get pitch and demo-day events assigned to this judge
      responses:
        "200":
          description: Assigned pitch events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeDashboard"
        "403":
          description: Judge access required
  /judge/scorecards/{id}:
    patch:
      operationId: submitJudgeScorecard
      tags: [pitches]
      summary: Submit an individual score and feedback for an assigned pitch
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeScorecardInput"
      responses:
        "200":
          description: Saved judge scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgePitch"
        "404":
          description: Pitch is not assigned to this judge
  /mentor/support/{id}:
    patch:
      operationId: updateAssignedMentoring
      tags: [support]
      summary: Update the status, schedule, or notes for assigned mentoring
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorEngagementUpdate"
      responses:
        "200":
          description: Updated assigned mentoring engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorEngagement"
        "404":
          description: Engagement not assigned to this mentor
  /pitches/{id}/judges:
    get:
      operationId: listPitchJudges
      tags: [pitches]
      summary: List judges assigned to a pitch or demo-day event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Assigned judges and scorecard status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PitchJudgeAssignment" }
    post:
      operationId: assignPitchJudge
      tags: [pitches]
      summary: Assign a judge to an event
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PitchJudgeInput"
      responses:
        "201":
          description: Judge assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchJudgeAssignment"
        "409":
          description: Judge is already assigned
  /pitch-judge-assignments/{id}:
    delete:
      operationId: removePitchJudge
