        location: { type: ["string", "null"] }
        zoomUrl: { type: ["string", "null"], format: uri }
        recordingUrl: { type: ["string", "null"], format: uri }
        status: { type: string, enum: [scheduled, completed, cancelled] }
      required: [id, title, type, scheduledDate, startTime, facilitator, deliveryMode, location, zoomUrl, recordingUrl, status]
    ParticipantSupport:
      type: object
      properties:
        id: { type: integer }
        type: { $ref: "#/components/schemas/SupportType" }
        provider: { type: string }
        topic: { type: string }
        scheduledDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        status: { $ref: "#/components/schemas/SupportStatus" }
