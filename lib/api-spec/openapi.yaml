openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Program management platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: programs
    description: Program projects and cohorts
  - name: businesses
    description: Applicants and businesses through the program pipeline
  - name: applications
    description: Public intake, coordinator review, and founder progress
  - name: participants
    description: Founder self-service access to application and program progress
  - name: sessions
    description: Training and event sessions
  - name: support
    description: Mentoring, expert, and agency support
  - name: pitches
    description: Pitch-day and grant decisions
  - name: dashboard
    description: Program overview
  - name: auth
    description: Staff identity and access
  - name: staff
    description: Coordinator-managed team access
paths:
  /participant/announcements/{id}/replies:
    get:
      operationId: listParticipantAnnouncementReplies
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Private conversations owned by the signed-in participant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnnouncementConversation" }
  /communications/{id}/replies:
    get:
      operationId: listStaffAnnouncementReplies
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Private conversations in assigned active programs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnnouncementConversation" }
  /participant/announcements/{id}/replies/{applicationId}:
    post:
      operationId: sendParticipantAnnouncementReply
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: applicationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementReplyInput" }
      responses:
        "201":
          description: Reply saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementReply" }
  /communications/{id}/replies/{applicationId}:
    post:
      operationId: sendStaffAnnouncementReply
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: applicationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementReplyInput" }
      responses:
        "201":
          description: Response saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementReply" }
  /participant/announcements/{id}/replies/{applicationId}/read:
    post:
      operationId: readParticipantAnnouncementReplies
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: applicationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementReplyReadInput" }
      responses:
        "204": { description: Visible staff responses marked read }
  /communications/{id}/replies/{applicationId}/read:
    post:
      operationId: readStaffAnnouncementReplies
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: applicationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementReplyReadInput" }
      responses:
        "204": { description: Visible participant replies marked read for the program team }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /branding:
    get:
      operationId: getProgramBranding
      tags: [staff]
      summary: Get the public program branding settings
      responses:
        "200":
          description: Program name, logo, and brand colors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramBranding"
    put:
      operationId: updateProgramBranding
      tags: [staff]
      summary: Update program branding as a coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramBrandingInput"
      responses:
        "200":
          description: Updated program branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramBranding"
        "400":
          description: Invalid branding settings
        "403":
          description: Coordinator access required
  /branding/logo/upload-url:
    post:
      operationId: createBrandLogoUploadUrl
      tags: [staff]
      summary: Create a short-lived upload URL for a program logo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandLogoUploadInput"
      responses:
        "200":
          description: Signed upload URL and public logo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandLogoUploadResponse"
        "400":
          description: Unsupported logo file
        "403":
          description: Coordinator access required
  /branding/logo/{logoId}:
    get:
      operationId: getProgramBrandLogo
      tags: [staff]
      summary: Serve the currently configured program logo
      parameters:
        - name: logoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current program logo image
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          description: Logo not found
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get program dashboard overview
      responses:
        "200":
          description: Dashboard totals and upcoming activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /analytics:
    get:
      operationId: getProgramAnalytics
      tags: [dashboard]
      summary: Get coordinator-only program analytics
      parameters:
        - name: programId
          in: query
          required: false
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: to
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      responses:
        "200":
          description: Program participation, attendance, learning, support, and grant aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramAnalytics"
        "403":
          description: Coordinator access required
  /analytics/session-interactions:
    get:
      operationId: getProgramSessionInteractionAnalytics
      tags: [dashboard]
      summary: Compare poll and survey participation by program and session
      parameters:
        - name: programId
          in: query
          required: false
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: to
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: period
          in: query
          required: false
          description: Calendar period used to group the response trend
          schema: { type: string, enum: [weekly, monthly], default: weekly }
        - name: activityType
          in: query
          required: false
          description: Limit the interaction report to polls, surveys, or both
          schema: { type: string, enum: [all, poll, survey], default: all }
        - name: responseRateThreshold
          in: query
          required: false
          description: Flag open or closed activities with response rates below this percentage
          schema: { type: number, minimum: 0, maximum: 100, default: 30 }
      responses:
        "200":
          description: Aggregate poll and survey participation without answer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramSessionInteractionAnalytics"
        "403":
          description: Coordinator access required
  /analytics/report-layouts:
    get:
      operationId: listProgramAnalyticsReportLayouts
      tags: [dashboard]
      summary: List saved analytics report layouts for a program
      parameters:
        - name: programId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Saved report layouts for the program
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnalyticsReportLayout" }
        "404":
          description: Program not found
        "403":
          description: Coordinator access required
    post:
      operationId: createProgramAnalyticsReportLayout
      tags: [dashboard]
      summary: Save a named analytics report layout for a program
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsReportLayoutInput" }
      responses:
        "201":
          description: Saved report layout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsReportLayout" }
        "404":
          description: Program not found
        "409":
          description: A layout with this name already exists for the program
        "403":
          description: Coordinator access required
  /analytics/programs/{programId}/report-layouts/{id}:
    patch:
      operationId: updateProgramAnalyticsReportLayout
      tags: [dashboard]
      summary: Update a saved analytics report layout
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsReportLayoutUpdate" }
      responses:
        "200":
          description: Updated report layout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsReportLayout" }
        "404":
          description: Layout not found for the program
        "409":
          description: A layout with this name already exists for the program
        "403":
          description: Coordinator access required
    delete:
      operationId: deleteProgramAnalyticsReportLayout
      tags: [dashboard]
      summary: Remove a saved analytics report layout
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Report layout removed
        "404":
          description: Layout not found for the program
        "403":
          description: Coordinator access required
  /analytics/learning-progress:
    get:
      operationId: getLearningProgressAnalytics
      tags: [dashboard]
      summary: Get coordinator-only participant course progress and first-attempt cohort assessment averages
      parameters:
        - name: programId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Completion, active time, quiz performance, first-attempt cohort assessment averages and coverage, and certificate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressAnalytics"
        "403":
          description: Coordinator access required
  /analytics/learning-progress/applications/{id}/certificate:
    post:
      operationId: issueCourseCertificate
      tags: [dashboard]
      summary: Coordinator approves and issues a certificate for a participant who completed all required modules
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Certificate issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCertificate"
        "400":
          description: Participant has not completed all required modules
        "403":
          description: Coordinator access required
        "404":
          description: Accepted participant application not found
        "409":
          description: A certificate has already been issued for this application
  /analytics/learning-progress/certificates/{id}/revoke:
    post:
      operationId: revokeCourseCertificate
      tags: [dashboard]
      summary: Revoke an issued certificate while preserving its issue record
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateRevocationInput"
      responses:
        "200":
          description: Certificate revoked with its original issue details preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCertificate"
        "400":
          description: A revocation reason is required
        "403":
          description: Coordinator access required
        "404":
          description: Certificate not found
        "409":
          description: Certificate has already been revoked
  /certificates/{code}/verification:
    get:
      operationId: verifyCertificate
      tags: [certificates]
      summary: Publicly verify a certificate by its unique code
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CertificateCode" }
      responses:
        "200":
          description: Certificate record with its current validity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateVerification"
        "400":
          description: The supplied certificate code is invalid
        "404":
          description: No certificate was found for this code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /analytics/learning-progress/reminders/{id}/retry:
    post:
      operationId: retryCourseReminder
      tags: [dashboard]
      summary: Retry a failed course reminder email
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Reminder queued for a safe retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryCourseReminder"
        "403":
          description: Coordinator access required
        "404":
          description: Reminder delivery not found
        "409":
          description: Reminder is no longer failed
  /analytics/learning-progress/reminders/{id}/reconcile:
    post:
      operationId: reconcileCourseReminderDelivery
      tags: [dashboard]
      summary: Record a confirmed delivery or authorize a verified-absent course reminder retry
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileHeldEmailDeliveryBody" }
      responses:
        "200":
          description: Confirmed course reminder delivery recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileHeldEmailDeliveryResponse" }
        "202":
          description: Verified-absent course reminder queued for retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileHeldEmailDeliveryResponse" }
        "400":
          description: Gmail Sent verification is required
        "403":
          description: Coordinator access required
        "404":
          description: Reminder delivery not found
        "409":
          description: Reminder delivery is no longer held
  /analytics/attendance/{sessionId}:
    get:
      operationId: getSessionAttendanceRegister
      tags: [dashboard]
      summary: Get a session attendance register
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Session roster and recorded attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendanceRegister"
        "404":
          description: Session not found
        "403":
          description: Coordinator access required
        "503":
          description: Participant attendance schema update is not applied
    post:
      operationId: queueZoomAttendanceSync
      tags: [dashboard]
      summary: Queue a Zoom attendance report refresh
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Zoom attendance refresh status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoomAttendanceSync"
        "404":
          description: Session not found
        "403":
          description: Coordinator access required
        "503":
          description: Participant attendance schema update is not applied
    put:
      operationId: saveSessionAttendance
      tags: [dashboard]
      summary: Record or clear attendance for individual participants
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionAttendanceInput"
      responses:
        "200":
          description: Saved attendance register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendanceRegister"
        "400":
          description: Invalid attendance records
        "404":
          description: Session not found
        "403":
          description: Coordinator access required
        "503":
          description: Participant attendance schema update is not applied
  /analytics/attendance-participants/{participantId}:
    patch:
      operationId: resolveZoomAttendanceParticipant
      tags: [dashboard]
      summary: Match an unmatched Zoom attendee to a participant or ignore the attendee
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoomAttendanceParticipantResolutionInput"
      responses:
        "200":
          description: Updated session attendance register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendanceRegister"
        "400":
          description: Invalid participant resolution
        "404":
          description: Session or attendee not found
        "403":
          description: Coordinator access required
        "503":
          description: Participant attendance schema update is not applied
  /analytics/kpis:
    get:
      operationId: listProgramImpactKpis
      tags: [dashboard]
      summary: List impact indicators and latest business values
      parameters:
        - name: programId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Impact indicators for a program
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImpactKpi"
        "403":
          description: Coordinator access required
    post:
      operationId: createProgramImpactKpi
      tags: [dashboard]
      summary: Create a customizable impact indicator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactKpiInput"
      responses:
        "201":
          description: Created impact indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactKpi"
        "400":
          description: Invalid indicator
        "409":
          description: Indicator name already exists in the program
        "403":
          description: Coordinator access required
  /analytics/kpis/{id}:
    patch:
      operationId: updateProgramImpactKpi
      tags: [dashboard]
      summary: Update an impact indicator
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactKpiUpdate"
      responses:
        "200":
          description: Updated impact indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactKpi"
        "404":
          description: Indicator not found
        "409":
          description: Indicator name already exists in the program
        "403":
          description: Coordinator access required
    delete:
      operationId: deleteProgramImpactKpi
      tags: [dashboard]
      summary: Delete an impact indicator and its values
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Indicator deleted
        "404":
          description: Indicator not found
        "403":
          description: Coordinator access required
  /analytics/kpis/{id}/values:
    put:
      operationId: saveProgramImpactKpiValues
      tags: [dashboard]
      summary: Record business outcome values for an impact indicator
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactKpiValuesInput"
      responses:
        "200":
          description: Updated impact indicator values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactKpi"
        "400":
          description: Invalid values
        "404":
          description: Indicator or business not found in the program
        "403":
          description: Coordinator access required
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List program projects
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        "403":
          description: Archived programs are coordinator-only
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a program project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /programs/{id}:
    patch:
      operationId: updateProgram
      tags: [programs]
      summary: Update a program project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Program not found
    delete:
      operationId: deleteProgram
      tags: [programs]
      summary: Hard deletion is disabled; archive the program instead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "409":
          description: Programs are archived instead of deleted
        "403":
          description: Coordinator role required
        "404":
          description: Program not found
  /programs/lifecycle-events:
    get:
      operationId: listAllProgramLifecycleEvents
      tags: [programs]
      summary: Review archive and restore history across all programs
      responses:
        "200":
          description: Archive and restore history across all programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllProgramLifecycleEvent"
        "403":
          description: Coordinator role required
  /programs/{id}/lifecycle-events:
    get:
      operationId: listProgramLifecycleEvents
      tags: [programs]
      summary: Review archive and restore history for a program
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Program archive and restore history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramLifecycleEvent"
        "403":
          description: Coordinator role required
        "404":
          description: Program not found
  /programs/{id}/archive:
    post:
      operationId: archiveProgram
      tags: [programs]
      summary: Archive a program without deleting its records
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Archived program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "403":
          description: Coordinator role required
        "404":
          description: Program not found
        "409":
          description: Program is already archived
  /programs/{id}/restore:
    post:
      operationId: restoreProgram
      tags: [programs]
      summary: Restore an archived program
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Restored program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "403":
          description: Coordinator role required
        "404":
          description: Program not found
        "409":
          description: Program is not archived
  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List and filter applicants and businesses
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/BusinessStage"
        - name: programId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Add an applicant or business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
