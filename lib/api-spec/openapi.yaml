        size: { type: integer, minimum: 1, maximum: 262144000 }
        contentType: { type: string, minLength: 1, maxLength: 200 }
      required: [programId, name, size, contentType]
    CourseUploadUrl:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string }
      required: [uploadUrl, objectPath]
    ParticipantCourseMaterial:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        kind: { $ref: "#/components/schemas/CourseMaterialKind" }
        externalUrl: { type: ["string", "null"], format: uri }
        fileName: { type: ["string", "null"] }
        contentType: { type: ["string", "null"] }
        fileSize: { type: ["integer", "null"] }
      required: [id, title, description, kind, externalUrl, fileName, contentType, fileSize]
    ParticipantCourseModule:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        position: { type: integer }
