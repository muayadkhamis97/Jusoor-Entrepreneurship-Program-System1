        sessions:
          type: array
          items: { $ref: "#/components/schemas/ParticipantSession" }
        support:
          type: array
          items: { $ref: "#/components/schemas/ParticipantSupport" }
        calendlyMeetings:
          type: array
          items: { $ref: "#/components/schemas/ParticipantCalendlyMeeting" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ParticipantAssignment" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ParticipantQuestion" }
      required: [applicationId, applicationStatus, submittedAt, program, business, sessions, support, calendlyMeetings, assignments, questions]
