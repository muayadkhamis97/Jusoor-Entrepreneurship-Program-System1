      tags: [xapi]
      summary: Retrieve statements scoped to the active package launch
      parameters:
        - { in: header, name: Authorization, required: true, schema: { type: string } }
        - { in: header, name: X-Experience-API-Version, required: true, schema: { type: string, enum: ["1.0.3"] } }
        - { in: query, name: statementId, schema: { type: string, format: uuid } }
        - { in: query, name: registration, schema: { type: string, format: uuid } }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: until, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Statements recorded for this participant and package
          content:
            application/json:
              schema:
