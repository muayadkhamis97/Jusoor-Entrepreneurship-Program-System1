<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program controls style fixture</title>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/language.css" />
    <link rel="stylesheet" href="/src/workspace.css" />
    <link rel="stylesheet" href="/src/analytics.css" />
    <link rel="stylesheet" href="/src/api-integrations.css" />
    <link rel="stylesheet" href="/src/grant-surfaces.css" />
    <link rel="stylesheet" href="/src/calendar-communications.css" />
    <link rel="stylesheet" href="/src/branding-surfaces.css" />
    <link rel="stylesheet" href="/src/program-controls.css" />
    <style>
      body { padding: 24px; }
      .controls-fixture { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
      .controls-fixture > section { min-width: 0; display: grid; align-content: start; gap: 12px; padding: 16px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); }
      .controls-fixture label { display: grid; gap: 6px; }
      @media (max-width: 600px) { body { padding: 12px; } .controls-fixture { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <main class="controls-fixture">
      <section class="workspace">
        <button class="button button-primary" data-primary-family="workspace">حفظ التغييرات وإرسال التحديثات إلى جميع أعضاء البرنامج ومراجعة بيانات المشاركين والأنشطة والتقارير والتحقق من ملخص النتائج قبل المتابعة</button>
        <button class="button button-outline">الإجراء الثانوي</button>
        <button class="button button-danger">حذف البرنامج نهائيًا</button>
        <button class="button button-primary" disabled>جارٍ حفظ التغييرات</button>
        <button class="icon-button" type="button" aria-label="المزيد من الخيارات">
          <svg class="lucide-arrow-right icon-directional" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" /></svg>
        </button>
        <input class="form-control" aria-label="البحث في المشاركين" placeholder="ابحث عن مشارك" />
        <label class="mentor-follow-up-editor">تاريخ المتابعة<input class="form-control" aria-label="حقل متابعة المرشد" /></label>
        <div class="announcement-form"><input class="form-control" aria-label="حقل الإعلان" /></div>
        <div class="session-admin-actions"><button class="button button-primary">إدارة الجلسة</button></div>
        <div class="recording-ready-email"><button class="button button-primary">Recording action</button></div>
        <div class="mentor-follow-up-actions"><button class="button button-primary">Mentor action</button></div>
        <div class="participant-account-actions"><button class="button button-primary">Participant action</button></div>
        <div class="announcement-confirm"><button class="button button-quiet">Confirm action</button></div>
      </section>
      <section class="analytics-page">
        <button class="ana-button primary">عرض التحليلات</button>
        <button class="ana-tool"><span>تصدير التقرير</span></button>
        <label class="ana-field">تصفية النتائج<input aria-label="تصفية النتائج" /></label>
      </section>
      <section class="api-page">
        <button class="api-button api-button-primary">حفظ إعدادات الربط</button>
        <button class="api-button api-button-revoke">Revoke key</button>
        <label class="api-field">اسم التكامل<input aria-label="اسم التكامل" /></label>
      </section>
      <section>
        <div class="branding-form">
          <label class="branding-field"><span>Primary color hex value</span><input aria-label="Primary color hex value" value="#e8a33d" /></label>
        </div>
        <div class="branding-preview" style="--preview-primary:#e8a33d;--preview-primary-foreground:#23313e">
          <div class="branding-preview-body"><button type="button">معاينة الإجراء الرئيسي</button></div>
        </div>
      </section>
      <section class="workspace">
        <button class="button button-primary grant-action-button">تحديث المنحة</button>
        <label class="grant-status-filter">حالة المنحة<select aria-label="حالة المنحة"><option>الكل</option></select></label>
      </section>
    </main>
  </body>
</html>
